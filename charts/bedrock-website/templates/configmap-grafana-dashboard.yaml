{{/*
Grafana dashboard requested for the telemetry sidecars and PromPress. The
grafana_dashboard label is consumed by Grafana's common dashboard-sidecar.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bedrock-website.fullname" . }}-grafana-dashboard
  labels:
    {{- include "bedrock-website.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  bedrock-website.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "rate(apache_accesses_total{instance=~\"$apache_instance\"}[$__rate_interval])", "legendFormat": "requests", "refId": "A"}],
          "title": "Apache Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "apache_workers{instance=~\"$apache_instance\"}", "legendFormat": "{{ "{{" }}state{{ "}}" }}", "refId": "A"}],
          "title": "Apache Workers",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "rate(apache_sent_kilobytes_total{instance=~\"$apache_instance\"}[$__rate_interval]) * 1024", "legendFormat": "sent", "refId": "A"}],
          "title": "Apache Outbound Throughput",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum by (request_status) (rate(apache_http_requests_total{instance=~\"$mtail_instance\"}[$__rate_interval]))", "legendFormat": "{{ "{{" }}request_status{{ "}}" }}", "refId": "A"}],
          "title": "Access Log Request Rate by Status",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "id": 5,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(rate(apache_http_requests_total{instance=~\"$mtail_instance\",request_status=~\"5..\"}[$__rate_interval])) / sum(rate(apache_http_requests_total{instance=~\"$mtail_instance\"}[$__rate_interval]))", "refId": "A"}],
          "title": "Access Log 5xx Ratio",
          "type": "stat"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum by (request_method) (rate(apache_http_bytes_total{instance=~\"$mtail_instance\"}[$__rate_interval]))", "legendFormat": "{{ "{{" }}request_method{{ "}}" }}", "refId": "A"}],
          "title": "Access Log Response Throughput",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum by (status) (rate(prompress_request_count_total{instance=~\"$wordpress_instance\"}[$__rate_interval]))", "legendFormat": "{{ "{{" }}status{{ "}}" }}", "refId": "A"}],
          "title": "WordPress Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
          "id": 8,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(prompress_request_duration_seconds_bucket{instance=~\"$wordpress_instance\"}[$__rate_interval])))", "legendFormat": "p95", "refId": "A"}],
          "title": "WordPress Request Duration p95",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "MiB"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
          "id": 9,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(prompress_request_peak_memory_bucket{instance=~\"$wordpress_instance\"}[$__rate_interval])))", "legendFormat": "p95", "refId": "A"}],
          "title": "WordPress Peak Memory p95",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 24},
          "id": 10,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum(rate(prompress_query_duration_seconds_sum{instance=~\"$wordpress_instance\"}[$__rate_interval])) / sum(rate(prompress_query_duration_seconds_count{instance=~\"$wordpress_instance\"}[$__rate_interval]))", "legendFormat": "average", "refId": "A"}],
          "title": "WordPress Query Duration Average",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 24},
          "id": 11,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum by (level) (rate(prompress_error_count_total{instance=~\"$wordpress_instance\"}[$__rate_interval]))", "legendFormat": "{{ "{{" }}level{{ "}}" }}", "refId": "A"}, {"expr": "rate(prompress_exception_count_total{instance=~\"$wordpress_instance\"}[$__rate_interval])", "legendFormat": "exceptions", "refId": "B"}],
          "title": "WordPress Errors and Exceptions",
          "type": "timeseries"
        },
        {
          "datasource": "$datasource",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 24},
          "id": 12,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}},
          "targets": [{"expr": "sum(prompress_posts_total{instance=~\"$wordpress_instance\"})", "legendFormat": "posts", "refId": "A"}, {"expr": "sum(prompress_users_total{instance=~\"$wordpress_instance\"})", "legendFormat": "users", "refId": "B"}, {"expr": "sum(prompress_options_total{instance=~\"$wordpress_instance\"})", "legendFormat": "options", "refId": "C"}],
          "title": "WordPress Content Totals",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bedrock", "apache", "wordpress", "prompress"],
      "templating": {
        "list": [
          {"current": {}, "hide": 0, "includeAll": false, "label": "Datasource", "multi": false, "name": "datasource", "options": [], "query": "prometheus", "refresh": 1, "type": "datasource"},
          {"current": {}, "datasource": "$datasource", "definition": "label_values(apache_accesses_total, instance)", "hide": 0, "includeAll": true, "label": "Apache target", "multi": true, "name": "apache_instance", "options": [], "query": {"query": "label_values(apache_accesses_total, instance)", "refId": "StandardVariableQuery"}, "refresh": 1, "type": "query"},
          {"current": {}, "datasource": "$datasource", "definition": "label_values(apache_http_requests_total, instance)", "hide": 0, "includeAll": true, "label": "Access-log target", "multi": true, "name": "mtail_instance", "options": [], "query": {"query": "label_values(apache_http_requests_total, instance)", "refId": "StandardVariableQuery"}, "refresh": 1, "type": "query"},
          {"current": {}, "datasource": "$datasource", "definition": "label_values(prompress_request_count_total, instance)", "hide": 0, "includeAll": true, "label": "WordPress target", "multi": true, "name": "wordpress_instance", "options": [], "query": {"query": "label_values(prompress_request_count_total, instance)", "refId": "StandardVariableQuery"}, "refresh": 1, "type": "query"}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Bedrock Website Telemetry",
      "uid": "bedrock-website-telemetry",
      "version": 1
    }