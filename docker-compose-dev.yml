services:
  bedrock:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: bedrock
    network_mode: bridge
    restart: always
    ports:
      - 80:80
    env_file: .env
    # Apache runs as uid 33 and never starts as root, so low ports have to be
    # unprivileged in the container's network namespace.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    # The container runs unprivileged and can no longer append this to its own
    # /etc/hosts, which WordPress loopback calls to WP_HOME depend on.
    extra_hosts:
      - "${SITE_NAME:-localhost}:127.0.0.1"
    volumes:
      # Must be writable by uid 33 (www-data): `chown -R 33:33 /opt/1/uploads`.
      - /opt/1/uploads:/srv/bedrock/web/app/uploads
    # Same read-only root filesystem as the chart and docker-compose.yml, so
    # what is tested here is what is deployed. mode=1777 because a tmpfs mount
    # replaces the image's directory and compose cannot set its owner.
    read_only: true
    tmpfs:
      - /run/apache2:mode=1777
      - /run/lock/apache2:mode=1777
      - /etc/ssl/bedrock:mode=1777
      - /usr/local/share/ca-certificates:mode=1777
      - /etc/ssl/certs:mode=1777
      - /tmp:mode=1777
      - /var/www:mode=1777
      - /var/log/apache2:mode=1777
      - /srv/bedrock/web/app/cache:mode=1777
      - /srv/bedrock/web/app/plugins/independent-analytics/temp:mode=1777
