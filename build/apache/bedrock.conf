# Single Apache vhost set that replaces the previous nginx + PHP-FPM pair.
#
# Rationale: nginx and PHP-FPM meant two long-running processes supervised by
# supervisord inside one container, plus a hand-tuned FPM pool. PHP now runs as
# mod_php inside Apache, so Apache is the only process (PID 1) and no process
# manager tuning is carried in this repo - the image keeps the upstream
# mpm_prefork defaults on purpose.
#
# Port 80 is the real front door: public TLS is terminated by Cloudflare and the
# k8s ingress controller, which forwards plain HTTP to the container.
# Port 443 exists only so code inside the container can call itself over HTTPS
# (WordPress loopback / REST requests against WP_HOME, which is an https URL).
# It is deliberately not redirected to or from port 80.

# Logging split:
#   errors  -> container stderr, so `kubectl logs` / `docker logs` shows Apache
#              and PHP problems together in one stream.
#   access  -> a bounded file, since the k8s ingress already produces external
#              access logs and this copy is only for in-container inspection.
#
# Server-scope module errors are not associated with a vhost, so route them to
# stderr here as well as in each vhost.
ErrorLog /proc/self/fd/2

# The access log is declared once here at server level instead of inside each
# vhost: both vhosts inherit it, which keeps a single rotatelogs child writing
# to a single file. rotatelogs caps disk use (3 files x 50M) because nothing
# rotates logs for us inside the container.
CustomLog "|/usr/bin/rotatelogs -f -n 3 /var/log/apache2/access.log 50M" combined

# Directory-level configuration is global rather than duplicated in both vhosts,
# so the http and https entrypoints can never drift apart.
<Directory /srv/bedrock/web>
    Options -Indexes +FollowSymLinks
    # No .htaccess: rules live here so they are visible in the image and Apache
    # does not stat for override files on every request.
    AllowOverride None
    Require all granted

    DirectoryIndex index.php index.html

    # WordPress front controller. Query strings are passed through unchanged,
    # which is what the previous nginx `try_files $uri $uri/ /index.php?$args`
    # did.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]

    # Carried over from the nginx config.
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Robots-Tag "noindex, nofollow"

    # Deny direct access to dependency manifests and template sources.
    <FilesMatch "(^composer\.(json|lock)$|^installed\.json$|^auth\.json$|^package(-lock)?\.json$|^yarn\.lock$|\.blade\.php$|\.twig$)">
        Require all denied
    </FilesMatch>
</Directory>

# Uploads are user-writable content: never execute PHP from there.
# The Require rule is the real guard (authorization runs before the rewrite
# above, so it still applies to paths that do not exist on disk); disabling the
# engine is defence in depth for anything that reaches the handler.
<Directory /srv/bedrock/web/app/uploads>
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<VirtualHost *:80>
    ServerName ${SITE_NAME}
    DocumentRoot /srv/bedrock/web
</VirtualHost>

# Internal-only HTTPS endpoint backed by the self-signed certificate generated
# at startup by /run.sh. Nothing outside the container is expected to trust it.
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName ${SITE_NAME}
        DocumentRoot /srv/bedrock/web

        SSLEngine on
        SSLCertificateFile /etc/ssl/bedrock/server.crt
        SSLCertificateKeyFile /etc/ssl/bedrock/server.key
    </VirtualHost>
</IfModule>

# ---------------------------------------------------------------------------
# Telemetry
#
# mod_status is the only metrics source the image itself provides; Apache has
# no native Prometheus format, so a prometheus exporter scrapes this endpoint
# and translates it (run it as a k8s sidecar - keeping it out of this image is
# what preserves the single-process design). See the README.
#
# It listens on a separate loopback-only port rather than on a path under the
# public vhosts so that it is unreachable through the ingress, and so that the
# WordPress front-controller rewrite can never swallow the request.
<IfModule mod_status.c>
    # Per-request timing and byte counts. Without it the exporter can only
    # report worker scoreboard totals.
    ExtendedStatus On

    # Belt and braces: Debian ships a global <Location /server-status> with
    # mod_status. Deny it everywhere, then re-allow it only on the telemetry
    # listener below, so a rewrite or vhost change can never expose it.
    <Location /server-status>
        Require all denied
    </Location>

    Listen 127.0.0.1:8081

    <VirtualHost 127.0.0.1:8081>
        ServerName localhost

        <Location /server-status>
            SetHandler server-status
            Require ip 127.0.0.1
            Require ip ::1
        </Location>

        # This vhost serves nothing else.
        <Location />
            Require all denied
        </Location>

        # Scrapes would otherwise dominate the access log.
        CustomLog /dev/null combined
    </VirtualHost>
</IfModule>
