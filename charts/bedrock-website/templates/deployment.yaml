{{/*
Main container plus the four telemetry sidecars described in the README's
Telemetry section. The sidecars are identical for every site, so they are fixed
here rather than exposed as values.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bedrock-website.fullname" . }}
  labels:
    {{- include "bedrock-website.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bedrock-website.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "bedrock-website.labels" . | nindent 8 }}
    spec:
      # run.sh used to append this to /etc/hosts itself; it cannot now that the
      # container is unprivileged, and the mapping is not optional: WP_HOME is
      # a public https:// name that would otherwise resolve out to Cloudflare
      # and back for every WordPress loopback/REST call.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - {{ include "bedrock-website.hostname" . | quote }}

      securityContext:
        # uid/gid 33 (www-data) - the same identity uploads on the existing
        # claim were written under while Apache dropped its workers to it, so
        # this is not a re-owning migration. fsGroup makes the claim writable
        # for a *new* site; OnRootMismatch keeps the kubelet from walking a
        # large uploads tree on every start.
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        # What lets an unprivileged Apache bind :80 and :443 - the alternative,
        # CAP_NET_BIND_SERVICE on the binary, only works with
        # allowPrivilegeEscalation true. Namespaced to this pod's network, on
        # Kubernetes' safe-sysctl list since 1.22, and already the default in
        # every runtime here; set explicitly so nothing depends on that default.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"

      volumes:
        # Bridges the access log file to the two log sidecars. Emptied on pod
        # restart: this is for in-flight tailing, not durable log storage.
        - name: access-logs
          emptyDir: {}
        - name: mtail-programs
          configMap:
            name: {{ include "bedrock-website.fullname" . }}-mtail
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wordpress-data

        # readOnlyRootFilesystem leaves only mounted paths writable, so every
        # path the image writes to at runtime needs one of these. The limits
        # are ceilings on the node's ephemeral storage, not reservations, and
        # everything here is scratch: it is meant to be lost on restart.
        - name: apache-run
          emptyDir:
            sizeLimit: 16Mi
        - name: apache-lock
          emptyDir:
            sizeLimit: 16Mi
        - name: loopback-cert
          emptyDir:
            sizeLimit: 16Mi
        - name: ca-certificates-local
          emptyDir:
            sizeLimit: 16Mi
        - name: ca-certificates
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 128Mi
        - name: wp-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: analytics-temp
          emptyDir:
            sizeLimit: 64Mi

      containers:
        - name: bedrock
          # Calendar-versioned, not semver; bumped by hand via Chart.yaml
          # appVersion. Never `latest` (docs/image-versioning.md). Renovate now
          # reads this file (kubernetes manager) and is kept off this one image
          # by a packageRule in renovate.json - an inline `renovate:ignore`
          # comment is not honoured by that manager.
          image: "docker.io/anthonysautomations/bedrock_website:{{ .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            # PromPress metrics, on their own listener because the route is
            # denied on :80 (build/apache/bedrock.conf).
            - name: metrics-wp
              containerPort: 9118
          envFrom:
            # WP_HOME, WP_SITEURL, DB_NAME, DB_USER and the rest.
            - secretRef:
                name: {{ include "bedrock-website.fullname" . }}
          env:
            # Explicit env wins over envFrom, so this is authoritative even if
            # the Secret still carries an old SITE_NAME.
            - name: SITE_NAME
              value: {{ include "bedrock-website.hostname" . | quote }}
            - name: ACCESS_LOG
              value: "on"
            - name: PROXY_HOST
              value: proxy.default.svc
            - name: DB_HOST
              value: mysql.default.svc
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bedrock-website.dbPasswordSecret" . }}
                  key: password
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /srv/bedrock/web/app/uploads
              subPath: {{ include "bedrock-website.fullname" . }}
            - name: access-logs
              mountPath: /var/log/apache2
            # /run and /run/lock rather than /var/run and /var/lock: those are
            # symlinks in the Debian base image, and mounting through a symlink
            # is not something to rely on.
            - name: apache-run # PID file and the mod_ssl session cache
              mountPath: /run/apache2
            - name: apache-lock # the file mutexes Debian's apache2.conf sets
              mountPath: /run/lock/apache2
            - name: loopback-cert # regenerated by run.sh on every start now
              mountPath: /etc/ssl/bedrock
            - name: ca-certificates-local # where run.sh drops that certificate
              mountPath: /usr/local/share/ca-certificates
            # Masks the image's trust store, which update-ca-certificates then
            # rebuilds from /usr/share/ca-certificates plus the mount above. If
            # that ever fails the entrypoint aborts (set -e) rather than
            # serving with an empty set of CAs.
            - name: ca-certificates
              mountPath: /etc/ssl/certs
            - name: tmp # PHP upload staging; upload_max_filesize is 200M
              mountPath: /tmp
            - name: home # www-data's home, for wp-cli in an exec shell
              mountPath: /var/www
            - name: wp-cache # wp-content/cache, for the caching plugins
              mountPath: /srv/bedrock/web/app/cache
            - name: analytics-temp # scratch space run.sh creates for the plugin
              mountPath: /srv/bedrock/web/app/plugins/independent-analytics/temp
          # Apache runs as www-data throughout rather than starting as root to
          # bind :80/:443, and the pod's ip_unprivileged_port_start sysctl is
          # what replaces that privilege, so no capability is needed at all.
          #
          # A read-only root filesystem costs this image nothing: application
          # code, vendor/ and web/wp were already read-only to the site user,
          # and DISALLOW_FILE_MODS in config/application.php means WordPress
          # never writes to web/app/plugins or web/app/themes either - anything
          # it did write there was lost on the next restart regardless, since
          # only uploads is on a claim.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Probes Apache via mod_status, not WordPress, so a database outage
          # does not fail liveness. exec, not httpGet: the :8081 listener is
          # bound to 127.0.0.1, which the kubelet cannot reach - it probes the
          # pod IP. Same command as the image's own HEALTHCHECK.
          livenessProbe:
            exec:
              command:
                - curl
                - -fsS
                - -o
                - /dev/null
                - http://127.0.0.1:8081/server-status?auto
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Bedrock keeps core in web/wp. Every probe runs due cron events,
          # since DISABLE_WP_CRON is false (bedrock/config/application.php).
          readinessProbe:
            httpGet:
              path: /wp/wp-cron.php
              port: http
            initialDelaySeconds: 100
            periodSeconds: 100
            timeoutSeconds: 50
            failureThreshold: 3
          # Memory limits but no CPU limits, throughout: CPU requests already
          # guarantee a share under contention, while a CPU limit adds
          # throttling that shows up as latency even on an idle node. The
          # memory limit has to clear PHP's own 512M memory_limit
          # (build/php/php.ini) times the prefork workers serving requests.
          resources:
            {{- toYaml .Values.resources.bedrock | nindent 12 }}

        # --- Sidecar: mod_status -> Prometheus -----------------------------
        - name: apache-exporter
          image: bitnami/apache-exporter:1.0.8
          args:
            # Pod-local: the :8081 listener is bound to loopback.
            - --scrape_uri=http://127.0.0.1:8081/server-status?auto
          ports:
            - name: metrics-apache
              containerPort: 9117
          securityContext:
            runAsNonRoot: true
            # Pinned so the pod-level runAsUser (33, for the main container)
            # does not silently move this image off its own default uid.
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources.apacheExporter | nindent 12 }}

        # --- Sidecar: access log lines to its own stdout --------------------
        # Keeps access lines out of the main container's stderr (which carries
        # Apache/PHP errors) while still exposing them to `kubectl logs` and
        # any node-level collector watching container stdout.
        - name: access-log-tail
          image: busybox:1.38
          # -F retries the path, so it tolerates the file not existing yet.
          command:
            - /bin/sh
            - -c
            - exec tail -F /var/log/apache2/access.log
          volumeMounts:
            - name: access-logs
              mountPath: /var/log/apache2
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources.accessLogTail | nindent 12 }}

        # --- Sidecar: access log -> Prometheus metrics ----------------------
        - name: access-log-exporter
          image: ghcr.io/google/mtail:3.0.8
          args:
            - --logs=/var/log/apache2/access.log
            - --progs=/etc/mtail
            - --port=3903
          ports:
            - name: metrics-log
              containerPort: 3903
          volumeMounts:
            - name: access-logs
              mountPath: /var/log/apache2
              readOnly: true
            - name: mtail-programs
              mountPath: /etc/mtail
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources.accessLogExporter | nindent 12 }}

        # --- Sidecar: PromPress metric storage ------------------------------
        # PromPress accumulates counters across PHP requests and defaults to
        # 127.0.0.1:6379 when WP_REDIS_HOST/PORT are undefined, so there is
        # nothing to configure. Loopback-bound: an unauthenticated Redis must
        # not be reachable from the cluster network, which is also why it
        # needs no password and so no Secret. Persistence is off - counter
        # resets on restart are normal and handled by rate().
        - name: redis
          image: redis:8.10-alpine
          args:
            - --bind
            - 127.0.0.1
            - --protected-mode
            - "yes"
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
