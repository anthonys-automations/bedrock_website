# Builds and publishes the bedrock_website image as a multi-architecture
# manifest (linux/amd64 + linux/arm64).
#
# Reworked to implement the calendar tag strategy described in
# docs/image-versioning.md: deployments (and any downstream Renovate) need
# releases that are immutable and sortable, which the old `latest` +
# ISO-timestamp scheme did not provide.
#
# Tags published here:
#   <YYYY>.<MM>.<DD>.<N>   immutable release manifest, this is what deployments pin
#   latest                 moving alias, convenience only - never deploy it
#
# Architecture safety is the reason for the three-job shape. Each architecture
# builds natively on its own GitHub-hosted runner and pushes *untagged*, by
# digest only; the publish job is the only thing that ever creates a tag, and it
# depends on every build job succeeding. So if one architecture fails, the
# release simply does not happen: no tag moves, and a consumer sees no update
# rather than an update it cannot run on every node. An orphan untagged digest
# is invisible to tag listings and harmless.
#
# This replaces the previous split where CI published `-amd64` tags and arm64
# was built by hand into its own `-arm64` version stream. One tag now serves
# every node, so a deployment no longer has to know which architecture it runs
# on. The suffixed streams survive only as the out-of-band escape hatch in
# scripts/build-arm64.sh, which never advances this unsuffixed stream.
#
# Package inventory is not queried from an independently pulled base image
# before the build (that could drift from what actually gets installed, since
# both the Debian package index and Packagist are mutable). Instead the build
# enables a BuildKit SBOM attestation, which reflects the exact image that gets
# pushed; inspect it with:
#   docker buildx imagetools inspect --format '{{ json .SBOM }}' <repo>:<tag>
#
# Consumer Renovate configuration:
#   # renovate: datasource=docker depName=anthonysautomations/bedrock_website versioning=regex:^(?<major>\d{4})\.(?<minor>\d{2})\.(?<patch>\d{2})\.(?<build>\d+)$
#
# Brought over the same change-gating idea used by workflow.example/ci.yml
# (dorny/paths-filter): most pushes and every weekly schedule tick previously
# produced a release even when nothing under the image build context had
# changed. detect-changes now skips the release unless the Dockerfile, bedrock/
# or build/ changed, or the run was explicitly `force`d - the escape hatch a
# manual workflow_dispatch needs when a release is wanted regardless (e.g. to
# pick up a moved PHP base image tag).
name: Image build pipeline

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      force:
        description: 'Publish a release even if no relevant files changed'
        required: false
        type: boolean
        default: false
    outputs:
      repo:
        description: 'DockerHub repository the image was pushed to'
        value: ${{ jobs.prepare.outputs.repo }}
      version:
        description: 'Immutable release tag of the published multi-architecture manifest - deploy this one'
        value: ${{ jobs.prepare.outputs.version }}
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish a release even if no relevant files changed'
        required: false
        type: boolean
        default: false

  # Weekly rebuild: most releases carry no source change, what actually moves is
  # the PHP base image, its Debian packages and the Composer dependencies
  # resolved by `composer update` during the build. Left ungated by `force` (a
  # schedule trigger carries no inputs anyway) so it still runs in
  # if-something-changed mode - detect-changes decides from the last commit,
  # same as any other non-push trigger.
  schedule:
    - cron: '0 2 * * 1'

env:
  DOCKERHUB_REPO: anthonysautomations/bedrock_website
  # The publish guard fails closed if the build matrix drifts from this contract.
  EXPECTED_PLATFORMS: linux/amd64,linux/arm64

# Serialise the whole release so two runs on the same day cannot race for the
# same daily sequence number, and so two publish jobs cannot interleave their
# tag pushes.
concurrency:
  group: build-bedrock_website
  cancel-in-progress: false

jobs:
  # Gate every trigger (push via release.yml, the weekly schedule, and manual
  # runs) on whether the image build context actually changed, mirroring
  # workflow.example/ci.yml's dorny/paths-filter approach. `base` is pinned to
  # the ref that triggered the run: for a push that makes paths-filter diff
  # against the commit before the push (the "long-lived branch" mode in its
  # docs); for schedule/workflow_dispatch, which carry no push to diff, it
  # falls back to just the last commit. `force: true` bypasses the filter
  # entirely for a manual release.
  detect-changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Check for relevant changes
        id: filter
        if: ${{ !inputs.force }}
        uses: dorny/paths-filter@v4
        with:
          base: ${{ inputs.branch || github.ref_name }}
          filters: |
            image:
              - 'Dockerfile'
              - 'bedrock/**'
              - 'build/**'

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          if [[ "${{ inputs.force }}" == "true" ]]; then
            reason='forced by workflow_dispatch input'
            should_build=true
          elif [[ "${{ steps.filter.outputs.image }}" == "true" ]]; then
            reason='Dockerfile, bedrock/ or build/ changed'
            should_build=true
          else
            reason='no relevant changes detected'
            should_build=false
          fi
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "detect-changes: should_build=${should_build} (${reason})"

  # Every publication path, including this workflow's own schedule and manual
  # trigger, must pass the same runtime smoke test as a push release.
  validate:
    name: "Validate image"
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/validate-build.yml
    with:
      branch: ${{ inputs.branch || github.ref }}

  # Version and metadata are allocated once and shared by every architecture, so
  # each per-arch image carries byte-identical labels and the manifest describes
  # a single release rather than two coincidental builds.
  prepare:
    name: "Prepare ${{ inputs.branch || github.ref }}"
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    outputs:
      repo: ${{ steps.version.outputs.repo }}
      version: ${{ steps.version.outputs.version }}
      php_version: ${{ steps.meta.outputs.php_version }}
      created: ${{ steps.meta.outputs.created }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Resolve next release version
        id: version
        run: |
          set -euo pipefail
          # No arch argument: allocate from the unsuffixed, multi-arch stream.
          version=$(./scripts/next-version.sh "${DOCKERHUB_REPO}")
          echo "repo=${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Collect image metadata
        id: meta
        run: |
          set -euo pipefail

          # The PHP release is pinned in the Dockerfile, so read it straight
          # from there rather than from a separately pulled base image, whose
          # package index could have moved on since the build started.
          php_version=$(sed -nE 's|^FROM php:([A-Za-z0-9._-]+).*|\1|p' Dockerfile)
          php_version=${php_version%%$'\n'*}
          if [[ -z "${php_version}" ]]; then
            echo "error: could not determine the pinned PHP base image version" >&2
            exit 1
          fi

          echo "php_version=${php_version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      # Let the healthy architecture finish: its logs are the useful diagnostic
      # when the other one fails, and nothing is published either way.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner rather than qemu: emulating a Composer install
          # and a PHP extension build is slow enough to be its own failure mode.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          sbom: true
          # `push-by-digest` deliberately publishes no tag: an incomplete
          # release must leave nothing a deployment or Renovate can find. The
          # publish job below is the only thing that creates a tag.
          outputs: type=image,name=${{ needs.prepare.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          # Full provenance lives in labels and the SBOM: the tag stays short
          # and sortable while the exact PHP base version and the installed
          # package inventory (generated by BuildKit from the image that is
          # actually pushed) remain inspectable.
          labels: |
            org.opencontainers.image.title=bedrock_website
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            io.anthonysautomations.php.version=${{ needs.prepare.outputs.php_version }}
          # Bake the commit into the image itself (see the Dockerfile ARG) so it
          # is traceable from inside a running container, not only via labels.
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Images cleanup
        if: always()
        run: |
          docker image prune -f

  publish:
    name: "Publish release"
    # No `if: always()` - this dependency is the gate. If either architecture
    # failed, was cancelled, or never got a runner, no tag is created at all.
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify and create release manifest
        run: |
          set -euo pipefail
          repo='${{ needs.prepare.outputs.repo }}'
          version='${{ needs.prepare.outputs.version }}'

          expected_count=$(awk -F, '{ print NF }' <<< "${EXPECTED_PLATFORMS}")
          digest_count=$(find /tmp/digests -type f | wc -l)
          if [[ "${digest_count}" -ne "${expected_count}" ]]; then
            echo "error: expected ${expected_count} architecture digests, found ${digest_count}" >&2
            exit 1
          fi

          # The artefact file names are the bare digests pushed by the build jobs.
          refs=()
          for digest_file in /tmp/digests/*; do
            refs+=("${repo}@sha256:$(basename "${digest_file}")")
          done

          create_args=(
            --annotation "index:org.opencontainers.image.title=bedrock_website"
            --annotation "index:org.opencontainers.image.version=${version}"
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}"
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.created=${{ needs.prepare.outputs.created }}"
          )

          docker buildx imagetools create --dry-run \
            "${create_args[@]}" "${refs[@]}" > /tmp/release-manifest.json
          # SBOM/provenance attestations show up as `unknown/unknown` entries,
          # so they are filtered out rather than counted as platform coverage.
          covered_platforms=$(jq -r '[.manifests[] | select(.platform != null and .platform.os != "unknown")
                     | .platform.os + "/" + .platform.architecture]
                     | unique | join(",")' /tmp/release-manifest.json)
          expected_platforms=$(tr ',' '\n' <<< "${EXPECTED_PLATFORMS}" | sort | paste -sd, -)

          if [[ "${covered_platforms}" != "${expected_platforms}" ]]; then
            echo "error: candidate manifest covers [${covered_platforms}], expected [${expected_platforms}]" >&2
            exit 1
          fi

          docker buildx imagetools create --tag "${repo}:${version}" \
            "${create_args[@]}" "${refs[@]}"
          echo "published: ${repo}:${version} covers ${covered_platforms}"

      - name: Move the latest alias
        # Only after verification, and assembled from the verified index, so the
        # moving alias can never point at something the guard above rejected.
        run: |
          set -euo pipefail
          repo='${{ needs.prepare.outputs.repo }}'
          docker buildx imagetools create \
            --tag "${repo}:latest" \
            "${repo}:${{ needs.prepare.outputs.version }}"

      - name: Add build summary
        run: |
          # Link straight to the published tag on DockerHub, so the artefact
          # this run produced can be opened without hunting for it. Only the
          # immutable release tag is linked: the moving alias is not deployable
          # and points somewhere else by the time anyone reads this.
          {
            echo "## Build Summary"
            echo "- **Repository:** ${{ needs.prepare.outputs.repo }}"
            echo "- **Platforms:** ${EXPECTED_PLATFORMS}"
            echo "- **Release tag:** [${{ needs.prepare.outputs.version }}](https://hub.docker.com/layers/${{ needs.prepare.outputs.repo }}/${{ needs.prepare.outputs.version }}/)"
            echo "- **Moving alias:** latest"
            echo "- **PHP base image:** ${{ needs.prepare.outputs.php_version }}"
            echo "- **Git Hash:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # validate/prepare/build/publish all cascade-skip once detect-changes reports
  # nothing relevant changed (their `if:`/`needs` chain leads back to it), which
  # would otherwise leave a run with no summary at all. This is the only job
  # that runs in that case, so a skipped release is still visible from the run
  # list instead of looking like a silently do-nothing green check.
  skip-summary:
    name: "Release skipped"
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Add build summary
        run: |
          {
            echo "## Build Summary"
            echo "- **Result:** skipped - no relevant changes detected"
            echo "- **Repository:** ${DOCKERHUB_REPO}"
            echo "- Re-run manually with the \`force\` input set to build and publish anyway."
          } >> "$GITHUB_STEP_SUMMARY"
