services:
  bedrock_website:
    image: anthonysautomations/bedrock_website:$IMAGE_TAG
    container_name: bedrock_$ENV_NAME
    pull_policy: always
    restart: always
    ports:
      # Container port 80, not 443: public TLS is terminated upstream
      # (Cloudflare / ingress / host reverse proxy). The container's 443
      # listener is reserved for in-container HTTPS loopback calls and is
      # deliberately not published.
      - $PORT:80
    env_file: .env
    # Apache runs as uid 33 and never starts as root, so low ports have to be
    # unprivileged in the container's network namespace. This is the Docker
    # default; stated to match the Helm chart and survive a hardened daemon.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    # The container runs unprivileged and can no longer append this to its own
    # /etc/hosts. Without it SITE_NAME resolves to the public address and
    # WordPress loopback calls leave the host. Interpolated from ./.env.
    extra_hosts:
      - "${SITE_NAME:-localhost}:127.0.0.1"
    volumes:
      # Written by uid 33 (www-data) inside the container, which no longer
      # starts as root and cannot chown this for you: `chown -R 33:33 $VOL`.
      - $VOL:/srv/bedrock/web/app/uploads
    # These are the chart's writable paths expressed as Docker tmpfs mounts.
    read_only: true
    tmpfs:
      - /run/apache2:uid=33,gid=33
      - /run/lock/apache2:uid=33,gid=33
      - /etc/ssl/bedrock:uid=33,gid=33,mode=0700
      - /tmp:uid=33,gid=33,mode=1777
      - /var/www:uid=33,gid=33
      - /var/log/apache2:uid=33,gid=33
      - /srv/bedrock/web/app/cache:uid=33,gid=33
      - /srv/bedrock/web/app/plugins/independent-analytics/temp:uid=33,gid=33
