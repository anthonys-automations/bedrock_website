# Publishes a new amd64 image on every push to `dev`/`main`.
#
# Deployment is deliberately not chained here: releases are published, then
# rolled out separately by dispatching container_deploy.yml with the immutable
# tag this run allocated. Keeping build and deploy apart means a push cannot
# move a running environment on its own.
name: Release image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  # Same build-and-smoke-test validate-build.yml runs on Renovate branches,
  # run here so a push straight to dev/main (bypassing that Renovate check)
  # can't publish an image that builds but no longer serves.
  validate:
    name: "Validate image"
    uses: ./.github/workflows/validate-build.yml

  image_build:
    name: "Build image"
    needs: validate
    uses: ./.github/workflows/image_build.yml
    secrets: inherit
