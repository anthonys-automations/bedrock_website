# Build-only validation of the bedrock_website image.
#
# Added so Renovate branches get a real check result. The bot authenticates
# with GITHUB_TOKEN, whose pushes and pull requests never start a workflow run,
# so a `renovate/*` branch would otherwise carry no status at all and automerge
# would wait forever. The Renovate workflow dispatches this one explicitly
# (an API-triggered `workflow_dispatch` does run, unlike a bot push), which
# reports a check on the branch head that Renovate can then gate the merge on.
#
# Deliberately build-only: image_build.yml allocates an immutable release
# version and pushes to DockerHub, which must never happen from an unmerged
# branch.
#
# Runs on the same self-hosted ARM64 runner as the release build so a base image
# bump is validated on the architecture it will actually be published for.
name: Validate Image Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          # Mirrors the build arg used by image_build.yml so a missing or
          # renamed ARG is caught here rather than at release time.
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Images cleanup
        if: always()
        run: |
          docker image prune -f
