name: STG deployment

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  image_build:
    name: "Build image"
    uses: ./.github/workflows/image_build.yml
    secrets: inherit

  deploy_stg:
    name: "Container deployment"
    uses: ./.github/workflows/container_deploy.yml
    secrets: inherit
    needs: image_build
    with:
      ENV_NAME: mountainofwonders_stg
      # Deploy the immutable, architecture-scoped tag this run just allocated.
      # The build no longer publishes a plain `latest`, and deploying a moving
      # alias would defeat the whole point of the versioning scheme: there would
      # be no record of which image is actually running and nothing to roll back
      # to. See docs/image-versioning.md.
      IMAGE_TAG: ${{ needs.image_build.outputs.tag }}
      PORT: 8080
