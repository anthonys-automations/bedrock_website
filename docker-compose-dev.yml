services:
  bedrock:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: bedrock
    network_mode: bridge
    restart: always
    ports:
      - 80:80
    env_file: .env
    # Apache runs as uid 33 and never starts as root, so low ports have to be
    # unprivileged in the container's network namespace.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    # The container runs unprivileged and can no longer append this to its own
    # /etc/hosts, which WordPress loopback calls to WP_HOME depend on.
    extra_hosts:
      - "${SITE_NAME:-localhost}:127.0.0.1"
    volumes:
      # Must be writable by uid 33 (www-data): `chown -R 33:33 /opt/1/uploads`.
      - /opt/1/uploads:/srv/bedrock/web/app/uploads
    # Same writable paths and ownership as the chart and docker-compose.yml.
    read_only: true
    tmpfs:
      - /run/apache2:uid=33,gid=33
      - /run/lock/apache2:uid=33,gid=33
      - /etc/ssl/bedrock:uid=33,gid=33,mode=0700
      - /tmp:uid=33,gid=33,mode=1777
      - /var/www:uid=33,gid=33
      - /var/log/apache2:uid=33,gid=33
      - /srv/bedrock/web/app/cache:uid=33,gid=33
      - /srv/bedrock/web/app/plugins/independent-analytics/temp:uid=33,gid=33
