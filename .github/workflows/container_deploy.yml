name: Container deployment
run-name: "${{ inputs.IMAGE_TAG }} at ${{ inputs.ENV_NAME }}"

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string
      IMAGE_TAG:
        description: 'Immutable release tag, e.g. 2026.07.30.1-amd64 (see docs/image-versioning.md); moving aliases such as latest-amd64 must not be deployed'
        required: true
        type: string
      PORT:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ENV_NAME:
        required: true
        type: string
      IMAGE_TAG:
        description: 'Immutable release tag, e.g. 2026.07.30.1-amd64 (see docs/image-versioning.md); moving aliases such as latest-amd64 must not be deployed'
        required: true
        type: string
      PORT:
        required: true
        type: string

jobs:
  container_deploy:
    name: "${{ inputs.IMAGE_TAG }} at ${{ inputs.ENV_NAME }}"
    runs-on: ARM64

    env:
      DOCKER_HOST: ${{ vars[format('DOCKER_HOST_{0}', inputs.ENV_NAME)] }}
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      ENV_NAME: ${{ inputs.ENV_NAME }}
      PORT: ${{ inputs.PORT }}
      VOL: /mnt/bedrock_uploads_${{ inputs.ENV_NAME }}

    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker container
        run: |
          echo "${{ secrets[format('DOT_ENV_{0}', inputs.ENV_NAME)] }}" | base64 -d > .env
          docker compose --project-name "$ENV_NAME" up -d

      - name: Output container info
        run: |
          docker compose ps --no-trunc >> "$GITHUB_STEP_SUMMARY"
