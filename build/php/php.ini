memory_limit = 512M
post_max_size = 300M
upload_max_filesize = 200M

; Error handling. `error_log` is deliberately left unset: with mod_php that
; routes PHP warnings, notices and fatals into Apache's error log, which the
; vhost sends to the container's stderr. Do not point it at a file, or PHP
; errors stop showing up in `kubectl logs` / `docker logs`.
log_errors = On
display_errors = Off
